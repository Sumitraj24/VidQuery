<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - VidQuery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; background: var(--bg-alt); }
        .auth-split { display: flex; width: 100%; height: 100%; }
        .auth-left {
            flex: 1; background: linear-gradient(-45deg, #2563eb, #7e22ce, #3b82f6, #9333ea);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            display: flex; flex-direction: column; justify-content: center; padding: 4rem; color: white;
            position: relative; overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .auth-left h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem; position: relative; z-index: 2;}
        .auth-left p { font-size: 1.2rem; opacity: 0.9; max-width: 400px; line-height: 1.6; position: relative; z-index: 2;}
        
        /* Floating shapes */
        .shape { position: absolute; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); border-radius: 50%; animation: float 6s ease-in-out infinite; }
        .shape-1 { width: 300px; height: 300px; top: -50px; left: -100px; animation-delay: 0s; }
        .shape-2 { width: 250px; height: 250px; bottom: 50px; right: -50px; animation-delay: 2s; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .auth-right {
            flex: 1.2; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg-alt); position: relative;
        }
        .auth-box {
            width: 100%; max-width: 440px;
            background: white;
            padding: 3.5rem 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.03);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateX(40px);
        }
        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        
        .back-home { position: absolute; top: 2rem; right: 2rem; color: var(--text-muted); font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: color 0.2s;}
        .back-home:hover { color: var(--text-dark); }
        
        .auth-logo { display: flex; align-items: center; gap: 0.5rem; color: var(--primary); font-weight: 800; font-size: 1.5rem; margin-bottom: 2rem; justify-content: center; text-decoration: none;}
        .auth-logo svg { width: 28px; height: 28px; fill: currentColor; }
        
        .auth-box h2 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; color: var(--text-dark); letter-spacing: -0.02em;}
        .auth-box > p { text-align: center; color: var(--text-muted); margin-bottom: 2rem; }
        
        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-group input {
            width: 100%; padding: 1.2rem 1.25rem 0.6rem; border: 2px solid var(--border); border-radius: 12px;
            font-size: 1rem; font-family: inherit; transition: all 0.3s; background: transparent;
        }
        .input-group label {
            position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-weight: 500; transition: all 0.3s; pointer-events: none;
        }
        .input-group input:focus, .input-group input:not(:placeholder-shown) {
            border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label {
            top: 0.75rem; font-size: 0.75rem; color: var(--primary); font-weight: 600;
        }
        
        .btn-submit {
            width: 100%; padding: 1rem; background: var(--primary); color: white; font-size: 1.1rem; font-weight: 600;
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 14px rgba(37,99,235,0.3); position: relative; overflow: hidden;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,0.4); background: var(--primary-hover); }
        .btn-submit:active { transform: translateY(1px); box-shadow: 0 2px 10px rgba(37,99,235,0.3); }
        
        .auth-footer { text-align: center; margin-top: 2.5rem; color: var(--text-muted); font-weight: 500; }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        
        .auth-error { background: #fee2e2; color: #b91c1c; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        @media (max-width: 900px) {
            .auth-left { display: none; }
        }
    </style>
</head>
<body>
    <div class="auth-split">
        <div class="auth-left">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <h1>Unlock the power<br>of your videos.</h1>
            <p>Join thousands of students learning 10x faster with AI-powered video analysis, summaries, and mind maps.</p>
        </div>
        <div class="auth-right">
            <a href="/" class="back-home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to Home
            </a>
            
            <div class="auth-box">
                <a href="/" class="auth-logo">
                    <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
                    VidQuery
                </a>
                
                <h2>Create Account</h2>
                <p>Sign up to get started for free</p>
                
                {% if error %}
                <div class="auth-error">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    {{ error }}
                </div>
                {% endif %}
                
                <form method="POST" action="/register">
                    <div class="input-group">
                        <input type="email" name="email" id="email" placeholder=" " required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="password" placeholder=" " required>
                        <label for="password">Password</label>
                    </div>
                    <button type="submit" class="btn-submit">Sign Up</button>
                </form>
                
                <div class="auth-footer">
                    Already have an account? <a href="/login">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
