services:
  - type: web
    name: vidquery-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FREELLMAPI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: FREELLMAPI_API_KEY
        sync: false
      - key: FREELLMAPI_MODEL
        value: openai/gpt-oss-120b
      - key: FREELLMAPI_FAST_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: SUPABASE_URL
        value: https://abqffxkloinpsccxgsyz.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_82C01-tAL3KLCW4DFNsFXw_Mf_0a-UG
